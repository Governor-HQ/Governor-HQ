<svg width="1280" height="400" viewBox="0 0 1280 400" xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0e14"/>
      <stop offset="55%" stop-color="#0d1620"/>
      <stop offset="100%" stop-color="#0a0e14"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#026975"/>
      <stop offset="100%" stop-color="#EC8220"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1a2530" stroke-width="1"/>
    </pattern>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#026975" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#026975" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1280" height="400" fill="url(#bg)"/>
  <rect width="1280" height="400" fill="url(#grid)"/>
  <circle cx="1060" cy="120" r="220" fill="url(#glow)"/>

  <!-- circuit nodes, right side -->
  <g stroke="#233240" stroke-width="1.5" fill="none" opacity="0.8">
    <path d="M 950 60 L 1010 60 L 1010 110 L 1080 110"/>
    <path d="M 1000 220 L 1060 220 L 1060 170 L 1150 170"/>
    <path d="M 940 300 L 1000 300 L 1000 260 L 1090 260"/>
    <path d="M 1150 60 L 1150 40 L 1220 40"/>
  </g>
  <g fill="#026975">
    <circle cx="950" cy="60" r="4"/>
    <circle cx="1080" cy="110" r="4"/>
    <circle cx="1150" cy="170" r="4"/>
    <circle cx="940" cy="300" r="4"/>
    <circle cx="1090" cy="260" r="4"/>
  </g>
  <g fill="#EC8220">
    <circle cx="1010" cy="60" r="3.5"/>
    <circle cx="1060" cy="220" r="3.5"/>
    <circle cx="1000" cy="260" r="3.5"/>
    <circle cx="1220" cy="40" r="3.5"/>
  </g>

  <!-- pulse travelling along one trace -->
  <circle r="4" fill="#EC8220">
    <animateMotion dur="4.5s" repeatCount="indefinite"
      path="M 950 60 L 1010 60 L 1010 110 L 1080 110"/>
    <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.1;0.9;1" dur="4.5s" repeatCount="indefinite"/>
  </circle>

  <!-- left accent bar -->
  <rect x="0" y="0" width="6" height="400" fill="url(#accent)"/>

  <!-- name -->
  <text x="90" y="175" font-family="'JetBrains Mono', 'Space Grotesk', monospace" font-size="56" font-weight="700" fill="#eef2f5">
    Governor
    <tspan fill="#026975">_HQ</tspan>
  </text>

  <!-- prompt cursor -->
  <rect x="90" y="192" width="14" height="4" fill="#EC8220">
    <animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.5;0.51;1" dur="1.1s" repeatCount="indefinite"/>
  </rect>

  <!-- title line -->
  <text x="90" y="228" font-family="'JetBrains Mono', monospace" font-size="20" letter-spacing="2" fill="#8aa0ad">
    FULL-STACK DEVELOPER <tspan fill="#233240">//</tspan> CYBERSECURITY LEARNER
  </text>

  <!-- divider -->
  <rect x="90" y="250" width="120" height="2" fill="url(#accent)"/>

  <!-- tagline -->
  <text x="90" y="285" font-family="'Inter', 'Space Grotesk', sans-serif" font-size="16" fill="#5c7180">
    Building real products, one shipped feature at a time.
  </text>
</svg>
